[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="PyAPIfy"
version="0.3.1"
description="A batteries-included, dependency-light Python API framework."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Leila150"}]
keywords=["api","http","web","rest","async","framework"]
classifiers=["Programming Language :: Python :: 3","Framework :: FastAPI","License :: OSI Approved :: MIT License"]
[project.scripts]
pyapify="pyapify.cli.main:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
